<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="a-woodworth's live version of Frontend Mentor's Social Links Profile Challenge"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Frontend Mentor | Social Links Profile</title>
  </head>
  <body>
    <main>
      <h1 class="sr-only">Jessica Randall's Social Links Profile</h1>
      <article class="card" aria-label="My Profile">
        <div class="card-heading">
          <h2>Jessica Randall</h2>
          <img
            src="assets/images/avatar-jessica.jpeg"
            alt="Jessica Randall avatar"
            width="88"
            height="88"
          />
        </div>
        <div class="card-content">
          <p>London, United Kingdom</p>
          <p>"Front-end developer and avid reader."</p>
          <ul class="card-links" aria-label="Social Media Links">
            <li>
              <a href="https://github.com">GitHub</a>
            </li>
            <li>
              <a href="https://www.frontendmentor.io"
                >Frontend Mentor</a
              >
            </li>
            <li>
              <a href="https://www.linkedin.com">LinkedIn</a>
            </li>
            <li>
              <a href="https://x.com">Twitter</a>
            </li>
            <li>
              <a href="https://www.instagram.com">Instagram</a>
            </li>
          </ul>
        </div>
      </article>
    </main>
    <footer class="main-footer">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge"
          >Frontend Mentor</a
        >. Coded by
        <a href="https://github.com/a-woodworth">a-woodworth</a>.
      </p>
    </footer>
  </body>
</html>
